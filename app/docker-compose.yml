version: '3.8'

services:
  shard-0:
    build: 
      context: ./sharding/shard0
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - DB_PATH=/data/shard.db
    volumes:
      - ./sharding/data/shard0:/data

  shard-1:
    build: 
      context: ./sharding/shard1
      dockerfile: Dockerfile
    ports:
      - "5002:5000"
    environment:
      - PORT=5000
      - DB_PATH=/data/shard.db
    volumes:
      - ./sharding/data/shard1:/data

  shard-2:
    build: 
      context: ./sharding/shard2
      dockerfile: Dockerfile
    ports:
      - "5003:5000"
    environment:
      - PORT=5000
      - DB_PATH=/data/shard.db
    volumes:
      - ./sharding/data/shard2:/data
